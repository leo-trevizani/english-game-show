<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Game Show: Global Journalism</title>
    <meta
      name="description"
      content="Offline single-file interactive classroom game show for Global Journalism with Trivia, Flashcards Swipe, Data Tables, and News Framing modes."
    />
    <meta property="og:title" content="English Game Show: Global Journalism" />
    <meta
      property="og:description"
      content="Offline single-file interactive classroom game show for Global Journalism with Trivia, Flashcards Swipe, Data Tables, and News Framing modes."
    />
    <meta property="og:type" content="website" />
    <style>
      /* ==========================================================================
         DESIGN.md — Tokens & Custom Properties (Strictly Offline, Zero CDNs)
         ========================================================================== */
      :root {
        /* Colors */
        --color-dark-green: #202923;
        --color-vibrant-green: #34A853;
        --color-pure-black: #0D0D0D;
        --color-dark-gray: #282D29;
        --color-mid-gray: #808080;
        --color-soft-green: #D6EEDD;
        --color-canvas-white: #F5FFF8;
        --color-absolute-white: #FFFFFF;

        /* Typography */
        --font-instrument-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

        /* Type Scale (Slightly roomier floor + scales up in larger/fullscreen displays) */
        --text-micro: 13px;
        --text-caption: 15px;
        --text-body-sm: 17px;
        --text-body: 19px;
        --text-subheading: 26px;
        --text-heading-sm: 34px;
        --text-heading: 52px;
        --text-display: 64px;
        --text-display-lg: 80px;

        /* Line Heights */
        --lh-display: 1.20;
        --lh-headline: 1.30;
        --lh-subheading: 1.50;
        --lh-body: 1.60;

        /* Spacing Scale */
        --space-4: 4px;
        --space-8: 8px;
        --space-12: 12px;
        --space-16: 16px;
        --space-24: 24px;
        --space-32: 32px;
        --space-48: 48px;
        --space-64: 64px;
        --spacing-section-gap: 64px;

        /* Border Radius */
        --radius-tags: 9999px;
        --radius-cards: 16px;
        --radius-inputs: 12px;
        --radius-buttons: 9999px;
        --radius-image-masks: 16px;

        /* Shadows & Borders */
        --border-light: 1px solid var(--color-soft-green);
        --border-dark: 1px solid var(--color-dark-green);
        --shadow-light: 0px 8px 24px rgba(214, 238, 221, 0.4);
        --shadow-dark: 0px 8px 24px rgba(32, 41, 35, 0.4);

        /* Motion */
        --ease-settle: cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Reset & Base */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background-color: var(--color-canvas-white);
        color: var(--color-dark-gray);
        font-family: var(--font-instrument-sans);
        font-size: var(--text-body);
        line-height: var(--lh-body);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: var(--space-24);
        overflow-x: hidden;
        transition: background-color 180ms ease;
      }

      body[data-view="home"] {
        background-color: var(--color-vibrant-green);
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }

      button:focus-visible {
        outline: 3px solid var(--color-vibrant-green);
        outline-offset: 3px;
      }

      body[data-view="home"] button:focus-visible {
        outline-color: var(--color-absolute-white);
      }

      .tabular {
        font-variant-numeric: tabular-nums;
      }

      /* ==========================================================================
         16:9 Centered Desktop Stage & Persistent Global Controls
         ========================================================================== */
      .app-stage {
        width: min(1280px, 100%);
        min-height: min(720px, calc(100dvh - 48px));
        display: grid;
        grid-template-rows: auto 1fr;
        gap: var(--space-32);
        align-items: stretch;
      }

      .global-bar {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: var(--space-24);
        padding-bottom: var(--space-16);
        border-bottom: var(--border-light);
      }

      body[data-view="home"] .global-bar {
        border-bottom: 1px solid rgba(255, 255, 255, 0.35);
      }

      .global-breadcrumb {
        display: flex;
        align-items: center;
        gap: var(--space-12);
        font-size: var(--text-caption);
        line-height: var(--lh-body);
        color: var(--color-mid-gray);
        font-weight: 500;
        min-width: 0;
      }

      .global-breadcrumb-brand {
        color: var(--color-dark-green);
        font-weight: 600;
        white-space: nowrap;
      }

      .global-breadcrumb-sep {
        color: var(--color-soft-green);
        font-weight: 700;
        user-select: none;
      }

      .global-breadcrumb-mode {
        color: var(--color-dark-gray);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      body[data-view="home"] .global-breadcrumb-brand {
        color: rgba(255, 255, 255, 0.78);
        font-weight: 500;
      }

      body[data-view="home"] .global-breadcrumb-sep,
      body[data-view="home"] .global-breadcrumb-mode {
        display: none;
      }

      .global-actions {
        display: flex;
        align-items: center;
        gap: var(--space-12);
      }

      .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: var(--radius-buttons);
        background-color: var(--color-absolute-white);
        border: var(--border-light);
        color: var(--color-dark-green);
        display: grid;
        place-items: center;
        box-shadow: var(--shadow-light);
        transition:
          transform 160ms var(--ease-settle),
          border-color 160ms ease,
          background-color 160ms ease,
          color 160ms ease;
      }

      .icon-btn:hover {
        border-color: var(--color-dark-green);
        transform: translateY(-1px);
      }

      .icon-btn[aria-current="page"] {
        background-color: var(--color-dark-green);
        border-color: var(--color-dark-green);
        color: var(--color-absolute-white);
      }

      body[data-view="home"] .icon-btn {
        background-color: transparent;
        border: 1px solid rgba(255, 255, 255, 0.65);
        color: var(--color-absolute-white);
        box-shadow: none;
      }

      body[data-view="home"] .icon-btn:hover {
        border-color: var(--color-absolute-white);
        background-color: rgba(255, 255, 255, 0.14);
      }

      body[data-view="home"] .icon-btn[aria-current="page"] {
        background-color: var(--color-absolute-white);
        border-color: var(--color-absolute-white);
        color: var(--color-vibrant-green);
      }

      .icon-btn svg {
        width: 20px;
        height: 20px;
        display: block;
      }

      .stage-main {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
      }

      .view-container {
        width: 100%;
        display: grid;
        align-content: center;
        gap: var(--space-32);
      }

      .view-container.is-entering {
        animation: viewEnter 180ms var(--ease-settle) both;
      }

      @keyframes viewEnter {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Shared Buttons (DESIGN.md) */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-8);
        padding: 12px 28px;
        min-height: 44px;
        border-radius: var(--radius-buttons);
        background-color: var(--color-vibrant-green);
        color: var(--color-absolute-white);
        font-size: var(--text-body-sm);
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
        transition:
          transform 160ms var(--ease-settle),
          opacity 160ms ease,
          box-shadow 160ms ease;
      }

      .btn-primary:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: var(--shadow-light);
      }

      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-8);
        padding: 12px 28px;
        min-height: 44px;
        border-radius: var(--radius-buttons);
        background-color: var(--color-canvas-white);
        border: var(--border-dark);
        color: var(--color-dark-green);
        font-size: var(--text-body-sm);
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
        transition:
          transform 160ms var(--ease-settle),
          background-color 160ms ease,
          color 160ms ease;
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: var(--color-dark-green);
        color: var(--color-absolute-white);
        transform: translateY(-1px);
      }

      .btn-secondary:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* ==========================================================================
         1. HOME SCREEN (MAIN MENU — MINIMALIST VIBRANT GREEN LAYOUT)
         ========================================================================== */
      .home-view {
        gap: var(--space-48);
        padding: var(--space-16) 0;
        max-width: 820px;
        margin: 0 auto;
      }

      .home-header {
        display: grid;
        text-align: center;
        justify-items: center;
      }

      .home-title {
        font-size: clamp(34px, 3.8vw, var(--text-heading));
        line-height: var(--lh-display);
        letter-spacing: -0.01em;
        font-weight: 500;
        color: var(--color-absolute-white);
        text-wrap: balance;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-24);
      }

      .menu-card {
        position: relative;
        overflow: hidden;
        text-align: left;
        background-color: var(--color-absolute-white);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: var(--radius-cards);
        padding: 0 16px 0 32px;
        height: 156px;
        box-shadow: 0px 10px 28px rgba(32, 41, 35, 0.16);
        display: grid;
        grid-template-columns: 1fr 176px;
        align-items: center;
        gap: var(--space-12);
        transition:
          transform 180ms var(--ease-settle),
          box-shadow 180ms ease;
      }

      .menu-card:hover {
        transform: translateY(-3px);
        box-shadow: 0px 16px 36px rgba(32, 41, 35, 0.24);
      }

      .menu-card-title {
        position: relative;
        z-index: 1;
        font-size: var(--text-subheading);
        line-height: 1.28;
        letter-spacing: -0.01em;
        font-weight: 500;
        color: var(--color-pure-black);
      }

      .menu-card-media {
        position: relative;
        width: 176px;
        height: 100%;
        display: grid;
        place-items: center;
        justify-self: end;
      }

      .menu-card-media img {
        position: absolute;
        top: 50%;
        right: -18px;
        transform: translateY(-50%);
        height: 212px;
        width: auto;
        max-width: none;
        max-height: none;
        object-fit: contain;
        display: block;
        pointer-events: none;
        user-select: none;
      }

      .menu-card-media.is-fallback img {
        display: none;
      }

      .menu-card-media-fallback {
        display: none;
        width: 88px;
        height: 88px;
        border-radius: var(--radius-inputs);
        background-color: var(--color-canvas-white);
        border: var(--border-light);
        color: var(--color-vibrant-green);
        place-items: center;
      }

      .menu-card-media.is-fallback .menu-card-media-fallback {
        display: grid;
      }

      /* ==========================================================================
         SHARED STAGE HEADER / NAV CONTROLS FOR GAMES
         ========================================================================== */
      .game-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-16);
        flex-wrap: wrap;
      }

      .game-progress {
        display: flex;
        align-items: center;
        gap: var(--space-12);
        font-size: var(--text-body-sm);
        line-height: var(--lh-body);
        color: var(--color-mid-gray);
        font-weight: 500;
      }

      .game-progress strong {
        color: var(--color-pure-black);
        font-weight: 600;
      }

      .nav-controls {
        display: flex;
        align-items: center;
        gap: var(--space-12);
      }

      /* ==========================================================================
         2. GAME 1: TRIVIA GAME
         ========================================================================== */
      .trivia-question-card {
        background-color: var(--color-absolute-white);
        border: var(--border-light);
        border-radius: var(--radius-cards);
        padding: var(--space-48) var(--space-32);
        box-shadow: var(--shadow-light);
        text-align: center;
        display: grid;
        gap: var(--space-16);
        justify-items: center;
      }

      .trivia-question-text {
        font-size: clamp(26px, 2.5vw, var(--text-heading-sm));
        line-height: var(--lh-headline);
        letter-spacing: -0.01em;
        font-weight: 600;
        color: var(--color-pure-black);
        text-wrap: balance;
        max-width: 34ch;
      }

      .trivia-note {
        font-size: var(--text-body-sm);
        line-height: var(--lh-body);
        color: var(--color-mid-gray);
        max-width: 58ch;
      }

      .trivia-note:empty {
        display: none;
      }

      .trivia-options-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-24);
      }

      .trivia-option {
        background-color: var(--color-absolute-white);
        border: var(--border-light);
        border-radius: var(--radius-cards);
        padding: var(--space-24) var(--space-32);
        box-shadow: var(--shadow-light);
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: var(--space-16);
        text-align: left;
        min-height: 92px;
        transition:
          transform 160ms var(--ease-settle),
          background-color 180ms ease,
          border-color 180ms ease,
          color 180ms ease,
          opacity 180ms ease;
      }

      .trivia-option:hover:not(:disabled) {
        transform: translateY(-2px);
        border-color: var(--color-dark-green);
      }

      .trivia-option-num {
        width: 36px;
        height: 36px;
        border-radius: var(--radius-buttons);
        border: var(--border-light);
        background-color: var(--color-canvas-white);
        color: var(--color-dark-green);
        font-size: var(--text-body-sm);
        font-weight: 600;
        display: grid;
        place-items: center;
        font-variant-numeric: tabular-nums;
      }

      .trivia-option-label {
        font-size: var(--text-body);
        line-height: var(--lh-subheading);
        letter-spacing: -0.005em;
        font-weight: 500;
        color: var(--color-dark-gray);
      }

      .trivia-option-badge {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: var(--text-caption);
        font-weight: 700;
        color: var(--color-absolute-white);
        white-space: nowrap;
      }

      /* State B (Answer) */
      .trivia-options-grid[data-revealed="true"] .trivia-option.is-correct {
        background-color: var(--color-vibrant-green);
        border-color: var(--color-vibrant-green);
        color: var(--color-absolute-white);
        box-shadow: var(--shadow-light);
        opacity: 1;
      }

      .trivia-options-grid[data-revealed="true"] .trivia-option.is-correct .trivia-option-num {
        background-color: var(--color-absolute-white);
        border-color: var(--color-absolute-white);
        color: var(--color-vibrant-green);
        font-weight: 700;
      }

      .trivia-options-grid[data-revealed="true"] .trivia-option.is-correct .trivia-option-label {
        color: var(--color-absolute-white);
        font-weight: 700;
      }

      .trivia-options-grid[data-revealed="true"] .trivia-option.is-correct .trivia-option-badge {
        display: inline-flex;
      }

      .trivia-options-grid[data-revealed="true"] .trivia-option.is-dimmed {
        opacity: 0.36;
      }

      /* ==========================================================================
         3. GAME 2: MAKE DO WITH 30s (FLASHCARDS SWIPE)
         ========================================================================== */
      .flashcards-view {
        justify-items: center;
        gap: var(--space-32);
      }

      .flashcards-hud {
        width: min(640px, 100%);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: var(--space-16);
      }

      .flashcards-score {
        font-size: var(--text-subheading);
        line-height: var(--lh-subheading);
        letter-spacing: -0.01em;
        font-weight: 700;
        color: var(--color-pure-black);
        font-variant-numeric: tabular-nums;
      }

      .flashcards-score span {
        color: var(--color-vibrant-green);
      }

      .flashcards-count {
        font-size: var(--text-caption);
        color: var(--color-mid-gray);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .flashcards-hud-right {
        display: flex;
        justify-content: flex-end;
      }

      .flashcard-deck-area {
        width: min(640px, 100%);
        min-height: 310px;
        display: grid;
        place-items: center;
        position: relative;
      }

      .flashcard {
        width: 100%;
        min-height: 320px;
        position: relative;
        perspective: 1200px;
        /* Explicitly disable text selection and native touch scroll to prevent drag glitches */
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        touch-action: none;
        cursor: grab;
        will-change: transform, opacity;
      }

      .flashcard:focus-visible {
        outline: 3px solid var(--color-vibrant-green);
        outline-offset: 6px;
        border-radius: var(--radius-cards);
      }

      .flashcard.is-dragging {
        cursor: grabbing;
        transition: none;
      }

      .flashcard.is-settling {
        transition:
          transform 220ms var(--ease-settle),
          opacity 200ms ease;
      }

      .flashcard-inner {
        position: relative;
        width: 100%;
        min-height: 320px;
        display: grid;
        transform-style: preserve-3d;
        transition: transform 360ms var(--ease-settle);
      }

      .flashcard-inner.is-flipped {
        transform: rotateY(180deg);
      }

      .flashcard-face {
        grid-area: 1 / 1;
        width: 100%;
        min-height: 320px;
        background-color: var(--color-absolute-white);
        border: var(--border-light);
        border-radius: var(--radius-cards);
        box-shadow: var(--shadow-light);
        padding: var(--space-48) var(--space-32);
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        gap: var(--space-16);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }

      .flashcard-face--back {
        transform: rotateY(180deg);
        background-color: var(--color-canvas-white);
        border-color: var(--color-vibrant-green);
        padding: var(--space-32);
      }

      .flashcard-cue {
        position: absolute;
        top: var(--space-24);
        z-index: 3;
        font-size: var(--text-caption);
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 6px 14px;
        border-radius: var(--radius-tags);
        opacity: 0;
        pointer-events: none;
        transition: opacity 100ms ease;
      }

      .flashcard-cue--skip {
        left: var(--space-24);
        background-color: var(--color-dark-green);
        color: var(--color-absolute-white);
      }

      .flashcard-cue--correct {
        right: var(--space-24);
        background-color: var(--color-vibrant-green);
        color: var(--color-absolute-white);
      }

      .flashcard-prompt {
        font-size: clamp(26px, 2.5vw, var(--text-heading-sm));
        line-height: var(--lh-headline);
        letter-spacing: -0.01em;
        font-weight: 600;
        color: var(--color-pure-black);
        text-wrap: balance;
        max-width: 28ch;
      }

      .flashcard-answer-single {
        font-size: clamp(26px, 2.5vw, var(--text-heading-sm));
        line-height: var(--lh-headline);
        letter-spacing: -0.01em;
        font-weight: 700;
        color: var(--color-dark-green);
        text-wrap: balance;
        max-width: 28ch;
      }

      .flashcard-answer-list {
        list-style: none;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 20px;
        text-align: left;
      }

      .flashcard-answer-list.is-compact {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px 14px;
      }

      .flashcard-answer-list li {
        font-size: var(--text-body-sm);
        line-height: 1.4;
        font-weight: 600;
        color: var(--color-dark-green);
        padding: 8px 12px;
        border-radius: var(--radius-inputs);
        background-color: var(--color-absolute-white);
        border: var(--border-light);
      }

      .flashcards-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(150px, 200px));
        gap: var(--space-24);
        justify-content: center;
      }

      .flashcard-done {
        width: 100%;
        min-height: 300px;
        background-color: var(--color-absolute-white);
        border: var(--border-light);
        border-radius: var(--radius-cards);
        box-shadow: var(--shadow-light);
        padding: var(--space-48) var(--space-32);
        display: grid;
        place-items: center;
        align-content: center;
        gap: var(--space-24);
        text-align: center;
      }

      .flashcard-done h2 {
        font-size: var(--text-heading-sm);
        line-height: var(--lh-headline);
        font-weight: 700;
        color: var(--color-pure-black);
      }

      /* ==========================================================================
         4. GAME 3: WRITE THEM RIGHT! (TWO 5x5 VOCABULARY GRIDS)
         ========================================================================== */
      .tables-view {
        justify-items: center;
        gap: var(--space-32);
        width: 100%;
      }

      .tables-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 2px minmax(0, 1fr);
        gap: var(--space-24);
        width: 100%;
        align-items: center;
      }

      .tables-divider {
        width: 2px;
        height: 100%;
        min-height: 360px;
        background-color: var(--color-vibrant-green);
        border-radius: 9999px;
      }

      .vocab-table-wrap {
        width: 100%;
        background-color: rgba(255, 255, 255, 0.85);
        border: 1.5px solid #B5DEC1;
        border-radius: var(--radius-cards);
        box-shadow: var(--shadow-light);
        overflow: hidden;
      }

      .vocab-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: auto;
      }

      .vocab-table td {
        border: 1px solid #B5DEC1;
        text-align: center;
        vertical-align: middle;
        height: clamp(66px, 9dvh, 92px);
        padding: 10px 6px;
        font-size: clamp(13px, 1.02vw, 18px);
        line-height: 1.28;
        font-weight: 400;
        color: var(--color-pure-black);
        white-space: normal;
        word-break: normal;
        overflow-wrap: normal;
      }

      .vocab-table tbody tr:first-child td {
        border-top: none;
      }

      .vocab-table tbody tr:last-child td {
        border-bottom: none;
      }

      .vocab-table td:first-child {
        border-left: none;
      }

      .vocab-table td:last-child {
        border-right: none;
      }

      .tables-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
      }

      /* ==========================================================================
         5. GAME 4: GUESS THE FRAMING
         ========================================================================== */
      .framing-view {
        justify-items: center;
        gap: var(--space-24);
      }

      .framing-tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--space-16);
        width: 100%;
      }

      .framing-tag {
        --tag-color: var(--color-dark-green);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 28px;
        min-height: 46px;
        border-radius: var(--radius-tags);
        background-color: var(--color-absolute-white);
        border: 1.5px solid var(--tag-color);
        box-shadow: var(--shadow-light);
        color: var(--tag-color);
        font-size: var(--text-body-sm);
        font-weight: 500;
        line-height: 1.2;
        white-space: nowrap;
        transition:
          background-color 180ms ease,
          border-color 180ms ease,
          box-shadow 180ms ease,
          color 180ms ease,
          opacity 180ms ease,
          transform 160ms var(--ease-settle);
      }

      .framing-tag[data-tag="Responsibility"] {
        --tag-color: #2563EB;
      }

      .framing-tag[data-tag="Economic"] {
        --tag-color: #DC2626;
      }

      .framing-tag[data-tag="Conflict"] {
        --tag-color: #CA8A04;
      }

      .framing-tag[data-tag="Human Interest"] {
        --tag-color: #9333EA;
      }

      .framing-tag[data-tag="Morality"] {
        --tag-color: #EA580C;
      }

      .framing-tag:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(32, 41, 35, 0.08);
      }

      .framing-tag-check {
        display: none;
      }

      .framing-tags[data-revealed="true"] .framing-tag.is-correct {
        background-color: var(--tag-color);
        border-color: var(--tag-color);
        box-shadow: 0 8px 22px rgba(32, 41, 35, 0.14);
        color: var(--color-absolute-white);
        font-weight: 700;
        opacity: 1;
      }

      .framing-tags[data-revealed="true"] .framing-tag.is-correct .framing-tag-check {
        display: inline-flex;
      }

      .framing-tags[data-revealed="true"] .framing-tag.is-dimmed {
        opacity: 0.34;
        transform: none;
      }

      .framing-media-card {
        width: min(840px, 100%);
        background-color: var(--color-absolute-white);
        border: var(--border-light);
        border-radius: var(--radius-cards);
        padding: var(--space-24);
        box-shadow: var(--shadow-light);
        display: grid;
        gap: var(--space-16);
      }

      .framing-image-wrap {
        width: 100%;
        height: auto;
        border-radius: var(--radius-image-masks);
        border: var(--border-light);
        overflow: hidden;
        background-color: var(--color-absolute-white);
        display: block;
        position: relative;
      }

      .framing-image-wrap img {
        width: 100%;
        height: auto;
        display: block;
      }

      .framing-image-fallback {
        display: none;
        padding: var(--space-32);
        text-align: center;
        gap: var(--space-8);
        color: var(--color-dark-gray);
      }

      .framing-image-wrap.is-fallback img {
        display: none;
      }

      .framing-image-wrap.is-fallback .framing-image-fallback {
        display: grid;
        place-items: center;
      }

      .framing-caption {
        display: grid;
        gap: var(--space-4);
        text-align: center;
        padding: 0 var(--space-8);
      }

      .framing-headline {
        font-size: var(--text-subheading);
        line-height: 1.4;
        letter-spacing: -0.01em;
        font-weight: 500;
        color: var(--color-pure-black);
        text-wrap: balance;
      }

      .framing-link {
        color: var(--color-vibrant-green);
        text-decoration: underline;
        text-underline-offset: 3px;
        font-weight: 500;
        transition: color 150ms ease;
      }

      .framing-link:hover,
      .framing-link:focus-visible {
        color: var(--color-dark-green);
      }

      .framing-footer {
        width: min(840px, 100%);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-16);
        flex-wrap: wrap;
      }

         RESPONSIVE BREAKPOINTS (Large / Fullscreen Classroom Displays & Mobile)
         ========================================================================== */
      @media (min-width: 1480px) and (min-height: 820px) {
        :root {
          --text-micro: 14px;

          height: 42px;
        }

          width: min(740px, 100%);

          width: min(940px, 100%);

          gap: var(--space-24);

      /* ==========================================================================
         PURE STATE TRANSITIONS (Decoupled for Predictability & Unit Testing)
         ========================================================================== */
      function shuffleArray(items, rng = Math.random) {
        const copy = items.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(rng() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function buildTriviaDeck(questions = GAME_DATA.trivia, rng = Math.random) {
        return shuffleArray(questions, rng).map((item) => {
          const tagged = item.options.map((text, idx) => ({
            text,
            isCorrect: idx === item.correctIndex
          }));
          const shuffledOptions = shuffleArray(tagged, rng);
          return {
            question: item.question,
            options: shuffledOptions.map((o) => o.text),
            correctIndex: shuffledOptions.findIndex((o) => o.isCorrect),
            note: item.note || ""
          };
        });
      }

      function buildFramingDeck(items = GAME_DATA.framing, rng = Math.random) {
        return shuffleArray(items, rng);
      }

      function scoreVocabTerm(term) {
        const clean = String(term).trim();
        const hasMultiWord = /[\s-]/.test(clean) ? 2.5 : 0;
        const technicalSuffix = /(ism|ity|tion|logy|ment|ence|ance|tive|ship|ing|bility)$/i.test(clean) ? 2 : 0;
        return clean.length + hasMultiWord + technicalSuffix;
      }

      function splitVocabTiers(words = GAME_DATA.tables.words) {
        const sorted = words
          .slice()
          .sort((a, b) => scoreVocabTerm(a) - scoreVocabTerm(b) || a.localeCompare(b));
        const third = Math.ceil(sorted.length / 3);
        return {
          easy: sorted.slice(0, third),
          medium: sorted.slice(third, third * 2),
          hard: sorted.slice(third * 2)
        };
      }

      function randomizeTables(data = GAME_DATA.tables, rng = Math.random) {
        const tiers = splitVocabTiers(data.words);
        const easyPool = shuffleArray(tiers.easy, rng);
        const mediumPool = shuffleArray(tiers.medium, rng);
        const hardPool = shuffleArray(tiers.hard, rng);

        // Balance each 25-cell grid: 9 short/simple + 8 medium + 8 long/complex = 25 unique words
        const left = shuffleArray(
          [...easyPool.slice(0, 9), ...mediumPool.slice(0, 8), ...hardPool.slice(0, 8)],
          rng
        );
        const right = shuffleArray(
          [...easyPool.slice(9, 18), ...mediumPool.slice(8, 16), ...hardPool.slice(8, 16)],
          rng
        );

        return { left, right };
      }

      function createGameState(data = GAME_DATA) {
        return {
          trivia: { index: 0, revealed: false, total: data.trivia.length },
          flashcards: { index: 0, correct: 0, total: data.flashcards.length },
          tables: randomizeTables(data.tables),
          framing: { index: 0, revealed: false, total: data.framing.length }
        };
      }

      function stepTrivia(state, direction) {
        const next = { ...state };
        if (direction === "next") {
          if (!next.revealed) {
            next.revealed = true;
          } else if (next.index < next.total - 1) {
            next.index += 1;
            next.revealed = false;
          }
        } else if (direction === "prev") {
          if (next.revealed) {
            next.revealed = false;
          } else if (next.index > 0) {
            next.index -= 1;
            next.revealed = true;
          }
        } else if (direction === "reveal") {
          next.revealed = true;
        }
        return next;
      }

      function swipeFlashcard(state, outcome) {
        if (state.index >= state.total) return { ...state };
        return {
          ...state,
          correct: outcome === "correct" ? state.correct + 1 : state.correct,
          index: state.index + 1
        };
      }

      function resetFlashcards(total) {
        return { index: 0, correct: 0, total };
      }

      function stepFraming(state, direction) {
        const next = { ...state };
        if (direction === "next") {
          if (!next.revealed) {
            next.revealed = true;
          } else if (next.index < next.total - 1) {
            next.index += 1;
            next.revealed = false;
          }
        } else if (direction === "prev") {
          if (next.revealed) {
            next.revealed = false;
          } else if (next.index > 0) {
            next.index -= 1;
            next.revealed = true;
          }
        } else if (direction === "reveal") {
          next.revealed = true;
        }
        return next;
      }

      /* ==========================================================================
         INLINE SVG ICON HELPERS (Zero External Dependencies)
         ========================================================================== */
      const ICONS = {

        arrowLeft:

        check:
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
        shuffle:
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></svg>',
        expand:
          '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
        compress:
          '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>'
      };

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = String(text);
        return div.innerHTML;
      }

      function attachAssetFallback(imgEl, fallbackContainer) {
        imgEl.addEventListener("error", () => {
          const rawSrc = imgEl.getAttribute("src") || "";
          if (!imgEl.dataset.retriedPublic && /^\.?\/assets\//.test(rawSrc)) {
            imgEl.dataset.retriedPublic = "1";
            imgEl.src = rawSrc.replace(/^\.?\/assets\//, "./public/assets/");
            return;
          }
          fallbackContainer.classList.add("is-fallback");
        });
      }

      /* ==========================================================================
         ROBUST STATE MANAGER & CLEAN EVENT LIFECYCLE
         ========================================================================== */
      const VIEW_LABELS = {
        home: "Main Menu",
        trivia: "Trivia Game",
        flashcards: "Make do with 30s",
        tables: "Write them Right!",
        framing: "Guess the Framing"
      };

      const App = {
        state: createGameState(GAME_DATA),
        triviaDeck: buildTriviaDeck(GAME_DATA.trivia),
        flashcardDeck: shuffleArray(GAME_DATA.flashcards),
        framingDeck: buildFramingDeck(GAME_DATA.framing),
        currentView: "home",
        activeKeyHandler: null,
        activeCleanup: null,
        swipeTimeoutId: null,

        init() {
          const btnHome = document.getElementById("btn-home");
          const btnFullscreen = document.getElementById("btn-fullscreen");

          btnHome.addEventListener("click", () => {
            this.navigate("home");
          });

          btnFullscreen.addEventListener("click", () => {
            this.toggleFullscreen();
          });

          document.addEventListener("fullscreenchange", () => {
            this.syncFullscreenIcon();
          });

          const params = new URLSearchParams(window.location.search);
          const requestedView = params.get("view");
          if (requestedView && VIEW_LABELS[requestedView]) {
            this.navigate(requestedView);
          } else if (params.get("autostart") === "1") {
            this.navigate("trivia");
          } else {
            this.navigate("home");
          }
        },

        toggleFullscreen() {
          try {
            if (!document.fullscreenElement) {
              const req = document.documentElement.requestFullscreen();
              if (req && typeof req.catch === "function") {
                req.catch(() => {});
              }
            } else {
              const exit = document.exitFullscreen();
              if (exit && typeof exit.catch === "function") {
                exit.catch(() => {});
              }
            }
          } catch (_) {
            // Silently ignore if browser blocks fullscreen outside user gesture
          }
        },

        syncFullscreenIcon() {
          const icon = document.getElementById("icon-fullscreen");
          const btn = document.getElementById("btn-fullscreen");
          const isFs = Boolean(document.fullscreenElement);
          icon.innerHTML = isFs ? ICONS.compress : ICONS.expand;
          btn.setAttribute("aria-label", isFs ? "Exit Fullscreen" : "Toggle Fullscreen");
          btn.setAttribute("title", isFs ? "Exit Fullscreen" : "Toggle Fullscreen");
        },

        /**
         * Completely unbinds any active keyboard & pointer/timer listeners
         * before rendering a new view so events never bubble or double-trigger.
         */
        cleanupActiveListeners() {
          if (this.activeKeyHandler) {
            window.removeEventListener("keydown", this.activeKeyHandler);
            this.activeKeyHandler = null;
          }
          if (typeof this.activeCleanup === "function") {
            this.activeCleanup();
            this.activeCleanup = null;
          }
          if (this.swipeTimeoutId !== null) {
            clearTimeout(this.swipeTimeoutId);
            this.swipeTimeoutId = null;
          }
        },

        bindArrowNavigation(handler) {
          if (this.activeKeyHandler) {
            window.removeEventListener("keydown", this.activeKeyHandler);
          }
          this.activeKeyHandler = (event) => {
            if (event.repeat) return;
            if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
              event.preventDefault();
              event.stopPropagation();
              handler(event.key);
            }
          };
          window.addEventListener("keydown", this.activeKeyHandler);
        },

        navigate(viewName) {
          const targetView = VIEW_LABELS[viewName] ? viewName : "home";
          this.cleanupActiveListeners();
          this.currentView = targetView;

          document.body.dataset.view = targetView;
          document.getElementById("breadcrumb-brand").textContent = "2026 © Leo Trevizani";
          document.getElementById("breadcrumb-mode").textContent = VIEW_LABELS[targetView];

          const btnHome = document.getElementById("btn-home");
          if (targetView === "home") {
            btnHome.setAttribute("aria-current", "page");
          } else {
            btnHome.removeAttribute("aria-current");
          }

          if (targetView === "home") this.renderHome(true);
          else if (targetView === "trivia") {
            this.triviaDeck = buildTriviaDeck(GAME_DATA.trivia);
            this.state.trivia = { index: 0, revealed: false, total: this.triviaDeck.length };
            this.renderTrivia(true);
          } else if (targetView === "flashcards") {
            this.flashcardDeck = shuffleArray(GAME_DATA.flashcards);
            this.state.flashcards = resetFlashcards(this.flashcardDeck.length);
            this.renderFlashcards(true);
          } else if (targetView === "tables") {
            this.state.tables = randomizeTables(GAME_DATA.tables);
            this.renderTables(true);
          } else if (targetView === "framing") {
            this.framingDeck = buildFramingDeck(GAME_DATA.framing);
            this.state.framing = { index: 0, revealed: false, total: this.framingDeck.length };
            this.renderFraming(true);
          }
        },

        /* ========================================================================
           1. HOME SCREEN (MAIN MENU)
           ======================================================================== */
        renderHome(animateEnter = false) {
          const stage = document.getElementById("stage-main");
          stage.innerHTML = `
            <section class="view-container home-view ${animateEnter ? "is-entering" : ""}" aria-label="Main Menu">
              <div class="home-header">
                <h1 class="home-title">English Game Show</h1>
              </div>

              <div class="menu-grid">
                ${GAME_DATA.homeCards
                  .map(
                    (card) => `
                      <button class="menu-card" type="button" data-route="${escapeHtml(card.route)}">
                        <h2 class="menu-card-title">${escapeHtml(card.line1)}<br />${escapeHtml(card.line2)}</h2>
                        <span class="menu-card-media">
                          <img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.alt)}" />
                          <span class="menu-card-media-fallback" aria-hidden="true">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <rect x="3" y="3" width="18" height="18" rx="3" />
                              <circle cx="8.5" cy="8.5" r="1.5" />
                              <path d="m21 15-5-5L5 21" />
                            </svg>
                          </span>
                        </span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </section>
          `;

          stage.querySelectorAll(".menu-card-media img").forEach((imgEl) => {
            attachAssetFallback(imgEl, imgEl.parentElement);
          });

          stage.querySelectorAll("[data-route]").forEach((card) => {
            card.addEventListener("click", () => {
              this.navigate(card.getAttribute("data-route"));
            });
          });
        },

        /* ========================================================================
           2. GAME 1: TRIVIA GAME
           ======================================================================== */
        renderTrivia(animateEnter = false) {
          const stage = document.getElementById("stage-main");
          const tState = this.state.trivia;
          const item = this.triviaDeck[tState.index];
          const isFirstStep = tState.index === 0 && !tState.revealed;
          const isLastStep = tState.index === tState.total - 1 && tState.revealed;

          stage.innerHTML = `
            <section class="view-container trivia-view ${animateEnter ? "is-entering" : ""}" data-state="${tState.revealed ? "answer" : "question"}" aria-label="Trivia Game">
              <div class="game-topbar">
                <div class="game-progress">
                  <strong class="tabular">Question ${tState.index + 1} of ${tState.total}</strong>
                </div>
                <div class="nav-controls">
                  <button id="trivia-prev" class="btn-secondary" type="button" ${isFirstStep ? "disabled" : ""}>
                    ${ICONS.arrowLeft}
                    <span>Previous</span>
                  </button>
                  <button id="trivia-next" class="btn-primary" type="button" ${isLastStep ? "disabled" : ""}>
                    <span>${tState.revealed ? "Next Question" : "Reveal Answer"}</span>
                    ${ICONS.arrowRight}
                  </button>
                </div>
              </div>

              <div class="trivia-question-card">
                <h1 class="trivia-question-text">${escapeHtml(item.question)}</h1>
                <p class="trivia-note">${tState.revealed && item.note ? escapeHtml(item.note) : ""}</p>
              </div>

              <div class="trivia-options-grid" data-revealed="${tState.revealed ? "true" : "false"}">
                ${item.options
                  .map((optionText, idx) => {
                    const isCorrect = idx === item.correctIndex;
                    const stateClass = tState.revealed
                      ? isCorrect
                        ? "is-correct"
                        : "is-dimmed"
                      : "";
                    return `
                      <button
                        class="trivia-option ${stateClass}"
                        type="button"
                        data-option-index="${idx}"
                        aria-pressed="${tState.revealed && isCorrect ? "true" : "false"}"
                      >
                        <span class="trivia-option-num">${idx + 1}</span>
                        <span class="trivia-option-label">${escapeHtml(optionText)}</span>
                        <span class="trivia-option-badge">${ICONS.check}<span>Correct</span></span>
                      </button>
                    `;
                  })
                  .join("")}
              </div>
            </section>
          `;

          const advance = (dir) => {
            const next = stepTrivia(this.state.trivia, dir);
            if (next.index !== this.state.trivia.index || next.revealed !== this.state.trivia.revealed) {
              this.state.trivia = next;
              this.renderTrivia();
            }
          };

          document.getElementById("trivia-prev").addEventListener("click", () => advance("prev"));
          document.getElementById("trivia-next").addEventListener("click", () => advance("next"));

          stage.querySelectorAll(".trivia-option").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (!this.state.trivia.revealed) {
                advance("reveal");
              }
            });
          });

          this.bindArrowNavigation((key) => {
            if (key === "ArrowRight") advance("next");
            else if (key === "ArrowLeft") advance("prev");
          });
        },

        /* ========================================================================
           3. GAME 2: MAKE DO WITH 30s (FLASHCARDS SWIPE)
           ======================================================================== */
        renderFlashcards(animateEnter = false) {
          const stage = document.getElementById("stage-main");
          const fState = this.state.flashcards;
          const isComplete = fState.index >= fState.total;
          const cardData = !isComplete ? this.flashcardDeck[fState.index] : null;

          const renderAnswerContent = (answers) => {
            if (!answers || answers.length === 0) return "";
            if (answers.length === 1) {
              return `<p class="flashcard-answer-single">${escapeHtml(answers[0])}</p>`;
            }
            const compactCls = answers.length > 6 ? "is-compact" : "";
            return `
              <ul class="flashcard-answer-list ${compactCls}">
                ${answers.map((ans) => `<li>${escapeHtml(ans)}</li>`).join("")}
              </ul>
            `;
          };

          stage.innerHTML = `
            <section class="view-container flashcards-view ${animateEnter ? "is-entering" : ""}" aria-label="Make do with 30s">
              <div class="flashcards-hud">
                <div class="flashcards-score" aria-live="polite">
                  Correct: <span id="flashcard-score">${fState.correct}</span>
                </div>
                <div class="flashcards-count">
                  ${isComplete ? `Completed ${fState.total} of ${fState.total}` : `Card ${fState.index + 1} of ${fState.total}`}
                </div>
                <div class="flashcards-hud-right">
                  <button id="flashcard-reset" class="btn-secondary" type="button">Reset</button>
                </div>
              </div>

              <div class="flashcard-deck-area">
                ${
                  isComplete
                    ? `
                      <div class="flashcard-done">
                        <h2>Round Complete</h2>
                        <p class="home-subtitle">Final score: <strong class="tabular">${fState.correct}</strong> out of <strong class="tabular">${fState.total}</strong> prompts.</p>
                        <button id="flashcard-play-again" class="btn-primary" type="button">Play Again</button>
                      </div>
                    `
                    : `
                      <div
                        id="active-flashcard"
                        class="flashcard is-settling"
                        data-card-index="${fState.index}"
                        data-flipped="false"
                        tabindex="0"
                        role="button"
                        aria-label="${escapeHtml(cardData.prompt)}"
                        aria-pressed="false"
                      >
                        <span id="cue-skip" class="flashcard-cue flashcard-cue--skip">Skip</span>
                        <span id="cue-correct" class="flashcard-cue flashcard-cue--correct">Correct</span>
                        <div id="active-flashcard-inner" class="flashcard-inner">
                          <div class="flashcard-face flashcard-face--front">
                            <h1 class="flashcard-prompt">${escapeHtml(cardData.prompt)}</h1>
                          </div>
                          <div class="flashcard-face flashcard-face--back">
                            ${renderAnswerContent(cardData.answers)}
                          </div>
                        </div>
                      </div>

                }

              <div class="flashcards-actions">
                <button id="btn-skip" class="btn-secondary" type="button" ${isComplete ? "disabled" : ""}>
                  ${ICONS.arrowLeft}
                  <span>Skip</span>
                </button>
                <button id="btn-correct" class="btn-primary" type="button" ${isComplete ? "disabled" : ""}>
                  <span>Correct</span>
                  ${ICONS.check}
                </button>
              </div>
            </section>
          `;

          let isAnimatingSwipe = false;
          let isFlipped = false;

          const doReset = () => {
            if (this.swipeTimeoutId !== null) {
              clearTimeout(this.swipeTimeoutId);
              this.swipeTimeoutId = null;
            }
            isAnimatingSwipe = false;
            this.flashcardDeck = shuffleArray(GAME_DATA.flashcards);
            this.state.flashcards = resetFlashcards(this.flashcardDeck.length);
            this.renderFlashcards();
          };

          document.getElementById("flashcard-reset").addEventListener("click", doReset);
          const playAgainBtn = document.getElementById("flashcard-play-again");
          if (playAgainBtn) {
            playAgainBtn.addEventListener("click", doReset);
          }

          const cardEl = document.getElementById("active-flashcard");
          const cardInner = document.getElementById("active-flashcard-inner");
          const cueSkip = document.getElementById("cue-skip");
          const cueCorrect = document.getElementById("cue-correct");
          const btnSkip = document.getElementById("btn-skip");
          const btnCorrect = document.getElementById("btn-correct");

          const toggleFlip = () => {
            if (!cardEl || !cardInner || isAnimatingSwipe) return;
            isFlipped = !isFlipped;
            cardInner.classList.toggle("is-flipped", isFlipped);
            cardEl.dataset.flipped = isFlipped ? "true" : "false";
            cardEl.setAttribute("aria-pressed", isFlipped ? "true" : "false");
          };

          const triggerSwipeOut = (outcome) => {
            if (isAnimatingSwipe || !cardEl) return;
            isAnimatingSwipe = true;

            const isRight = outcome === "correct";
            const exitX = isRight ? 540 : -540;
            const exitRot = isRight ? 14 : -14;

            if (cueSkip && cueCorrect) {
              cueSkip.style.opacity = isRight ? "0" : "1";
              cueCorrect.style.opacity = isRight ? "1" : "0";
            }

            cardEl.classList.remove("is-dragging");
            cardEl.classList.add("is-settling");
            cardEl.style.transform = `translate3d(${exitX}px, 16px, 0) rotate(${exitRot}deg)`;
            cardEl.style.opacity = "0";

            this.swipeTimeoutId = setTimeout(() => {
              this.swipeTimeoutId = null;
              this.state.flashcards = swipeFlashcard(this.state.flashcards, outcome);
              this.renderFlashcards();
            }, 220);
          };

          btnSkip.addEventListener("click", () => triggerSwipeOut("skip"));
          btnCorrect.addEventListener("click", () => triggerSwipeOut("correct"));

          // Pointer-based drag & click-to-flip (works seamlessly for both mouse & touch)
          if (cardEl) {
            let dragging = false;
            let startX = 0;
            let startY = 0;
            let dx = 0;
            let dy = 0;
            let maxMove = 0;
            let activePointerId = null;

            const onPointerDown = (e) => {
              if (isAnimatingSwipe) return;
              if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") return;
              dragging = true;
              activePointerId = e.pointerId;
              startX = e.clientX;
              startY = e.clientY;
              dx = 0;
              dy = 0;
              maxMove = 0;
              cardEl.classList.remove("is-settling");
              cardEl.classList.add("is-dragging");
              if (cardEl.setPointerCapture) {
                try {
                  cardEl.setPointerCapture(e.pointerId);
                } catch (_) {}
              }
            };

            const onPointerMove = (e) => {
              if (!dragging || e.pointerId !== activePointerId) return;
              dx = e.clientX - startX;
              dy = (e.clientY - startY) * 0.25;
              maxMove = Math.max(maxMove, Math.hypot(dx, e.clientY - startY));
              const rotate = Math.max(-14, Math.min(14, dx * 0.04));
              cardEl.style.transform = `translate3d(${dx}px, ${dy}px, 0) rotate(${rotate}deg)`;

              const ratio = Math.min(1, Math.abs(dx) / 110);
              if (dx > 12) {
                cueCorrect.style.opacity = String(ratio);
                cueSkip.style.opacity = "0";
              } else if (dx < -12) {
                cueSkip.style.opacity = String(ratio);
                cueCorrect.style.opacity = "0";
              } else {
                cueSkip.style.opacity = "0";
                cueCorrect.style.opacity = "0";
              }
            };

            const finishDrag = (e) => {
              if (!dragging || (e && e.pointerId !== activePointerId)) return;
              dragging = false;
              activePointerId = null;
              cardEl.classList.remove("is-dragging");
              cardEl.classList.add("is-settling");

              if (dx >= 110) {
                triggerSwipeOut("correct");
              } else if (dx <= -110) {
                triggerSwipeOut("skip");
              } else {
                cueSkip.style.opacity = "0";
                cueCorrect.style.opacity = "0";
                cardEl.style.transform = "translate3d(0px, 0px, 0) rotate(0deg)";
                if (maxMove < 8) {
                  toggleFlip();
                }
              }
            };

            const onCardKeyDown = (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                toggleFlip();
              }
            };

            cardEl.addEventListener("pointerdown", onPointerDown);
            cardEl.addEventListener("keydown", onCardKeyDown);
            window.addEventListener("pointermove", onPointerMove);
            window.addEventListener("pointerup", finishDrag);
            window.addEventListener("pointercancel", finishDrag);

            this.activeCleanup = () => {
              cardEl.removeEventListener("pointerdown", onPointerDown);
              cardEl.removeEventListener("keydown", onCardKeyDown);
              window.removeEventListener("pointermove", onPointerMove);
              window.removeEventListener("pointerup", finishDrag);
              window.removeEventListener("pointercancel", finishDrag);
            };
          }

          this.bindArrowNavigation((key) => {
            if (isComplete) return;
            if (key === "ArrowRight") triggerSwipeOut("correct");
            else if (key === "ArrowLeft") triggerSwipeOut("skip");
          });
        },

        /* ========================================================================
           4. GAME 3: WRITE THEM RIGHT! (TWO 5x5 VOCABULARY GRIDS)
           ======================================================================== */
        renderTables(animateEnter = false) {
          const stage = document.getElementById("stage-main");
          const board = this.state.tables;

          const buildVocabGrid = (words, teamLabel) => {
            const rows = [];
            for (let r = 0; r < 5; r++) {
              const slice = words.slice(r * 5, r * 5 + 5);
              rows.push(
                `<tr>${slice.map((word) => `<td>${escapeHtml(word)}</td>`).join("")}</tr>`
              );
            }
            return `
              <div class="vocab-table-wrap">
                <table class="vocab-table" aria-label="${escapeHtml(teamLabel)}">
                  <tbody>
                    ${rows.join("")}
                  </tbody>
                </table>
              </div>
            `;
          };

          stage.innerHTML = `
            <section class="view-container tables-view ${animateEnter ? "is-entering" : ""}" aria-label="Write them Right">
              <div class="tables-grid">
                ${buildVocabGrid(board.left, "Team 1 Vocabulary Grid")}
                <div class="tables-divider" aria-hidden="true"></div>
                ${buildVocabGrid(board.right, "Team 2 Vocabulary Grid")}
              </div>

              <div class="tables-footer">
                <button id="tables-randomize" class="btn-primary" type="button">
                  ${ICONS.shuffle}
                  <span>Randomize</span>
                </button>
              </div>
            </section>
          `;

          document.getElementById("tables-randomize").addEventListener("click", () => {
            this.state.tables = randomizeTables(GAME_DATA.tables);
            this.renderTables(false);
          });
        },

        /* ========================================================================
           5. GAME 4: GUESS THE FRAMING
           ======================================================================== */
        renderFraming(animateEnter = false) {
          const stage = document.getElementById("stage-main");
          const frState = this.state.framing;
          const item = this.framingDeck[frState.index];
          const isFirstStep = frState.index === 0 && !frState.revealed;
          const isLastStep = frState.index === frState.total - 1 && frState.revealed;

          stage.innerHTML = `
            <section class="view-container framing-view ${animateEnter ? "is-entering" : ""}" data-state="${frState.revealed ? "answer" : "question"}" aria-label="Guess the Framing">
              <div class="framing-tags" data-revealed="${frState.revealed ? "true" : "false"}">
                ${GAME_DATA.framingTags
                  .map((tagName) => {
                    const isCorrect = tagName === item.correctTag;
                    const cls = frState.revealed
                      ? isCorrect
                        ? "is-correct"
                        : "is-dimmed"
                      : "";
                    return `
                      <button
                        class="framing-tag ${cls}"
                        type="button"
                        data-tag="${escapeHtml(tagName)}"
                        aria-pressed="${frState.revealed && isCorrect ? "true" : "false"}"
                      >
                        <span class="framing-tag-check">${ICONS.check}</span>
                        <span>${escapeHtml(tagName)}</span>
                      </button>
                    `;
                  })
                  .join("")}
              </div>

              <div class="framing-media-card">
                <div id="framing-image-wrap" class="framing-image-wrap">
                  <img src="${escapeHtml(item.image || "./assets/news-placeholder.jpg")}" alt="${escapeHtml(item.alt || "News")}" id="framing-img">
                  <div class="framing-image-fallback">
                    <strong>Editorial Visual Slot</strong>
                    <span>Place your image at <code>./assets/news-placeholder.jpg</code></span>
                  </div>
                </div>
                <div class="framing-caption">
                  <h1 class="framing-headline">${escapeHtml(item.headline)} - <a class="framing-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">original link</a></h1>
                </div>
              </div>

              <div class="framing-footer">
                <div class="game-progress">
                  <strong class="tabular">Case ${frState.index + 1} of ${frState.total}</strong>
                </div>
                <div class="nav-controls">
                  <button id="framing-prev" class="btn-secondary" type="button" ${isFirstStep ? "disabled" : ""}>
                    ${ICONS.arrowLeft}
                    <span>Previous</span>
                  </button>
                  <button id="framing-next" class="btn-primary" type="button" ${isLastStep ? "disabled" : ""}>
                    <span>${frState.revealed ? "Next Case" : "Reveal Framing"}</span>
                    ${ICONS.arrowRight}
                  </button>
                </div>
              </div>
            </section>
          `;

          const imgEl = document.getElementById("framing-img");
          const imgWrap = document.getElementById("framing-image-wrap");
          attachAssetFallback(imgEl, imgWrap);

          const advanceFraming = (dir) => {
            const next = stepFraming(this.state.framing, dir);
            if (next.index !== this.state.framing.index || next.revealed !== this.state.framing.revealed) {
              this.state.framing = next;
              this.renderFraming();
            }
          };

          document.getElementById("framing-prev").addEventListener("click", () => advanceFraming("prev"));
          document.getElementById("framing-next").addEventListener("click", () => advanceFraming("next"));

          stage.querySelectorAll(".framing-tag").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (!this.state.framing.revealed) {
                advanceFraming("reveal");
              }
            });
          });

          this.bindArrowNavigation((key) => {
            if (key === "ArrowRight") advanceFraming("next");
            else if (key === "ArrowLeft") advanceFraming("prev");
          });
        }
      };

      window.__GAME_ENGINE__ = {
        GAME_DATA,
        shuffleArray,
        buildTriviaDeck,
        buildFramingDeck,
        createGameState,
        stepTrivia,
        swipeFlashcard,
        resetFlashcards,
        scoreVocabTerm,
        splitVocabTiers,
        randomizeTables,
        stepFraming
      };

      document.addEventListener("DOMContentLoaded", () => {
        App.init();
      });
    </script>
  </body>
</html>
